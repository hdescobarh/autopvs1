[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[project]
name = "autopvs1"
version = "0.1.0"
description = "Automatic PVS1 interpretation of null variants"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["pyfaidx"]

[dependency-groups]
dev = ["pytest"]

[tool.uv.build-backend]
source-include = ["config.ini", "tests/**", "CHANGELOG.md", "uv.lock"]
source-exclude = ["/data/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
